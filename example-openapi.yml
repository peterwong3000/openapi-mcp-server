openapi: 3.0.0
info:
  title: Example API
  version: 1.0.0
  description: This is an example OpenAPI specification
servers:
  - url: https://api.example.com/v1
    description: Production environment
  - url: https://staging-api.example.com/v1
    description: Staging environment

paths:
  /users:
    get:
      operationId: listUsers
      summary: Get user list
      description: Get a paginated list of all users
      tags:
        - users
      parameters:
        - name: page
          in: query
          description: Page number
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: User list returned successfully
        '400':
          description: Invalid request parameters

    post:
      operationId: createUser
      summary: Create a new user
      description: Create a new user account
      tags:
        - users
      requestBody:
        description: User information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid request parameters

  /users/{userId}:
    get:
      operationId: getUser
      summary: Get user details
      description: Get detailed information for a single user by ID
      tags:
        - users
      parameters:
        - name: userId
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User information returned successfully
        '404':
          description: User not found

    put:
      operationId: updateUser
      summary: Update user information
      description: Update information for the specified user
      tags:
        - users
      parameters:
        - name: userId
          in: path
          description: User ID
          required: true
          schema:
            type: string
      requestBody:
        description: Updated user information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Updated successfully
        '404':
          description: User not found

    delete:
      operationId: deleteUser
      summary: Delete user
      description: Delete the specified user
      tags:
        - users
      parameters:
        - name: userId
          in: path
          description: User ID
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted successfully
        '404':
          description: User not found

  /posts:
    get:
      operationId: listPosts
      summary: Get post list
      description: Get a list of all posts
      tags:
        - posts
      parameters:
        - name: userId
          in: query
          description: Filter posts by a specific user
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Post list returned successfully

    post:
      operationId: createPost
      summary: Create post
      description: Create a new post
      tags:
        - posts
      requestBody:
        description: Post content
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
      responses:
        '201':
          description: Post created successfully

  /posts/{postId}:
    get:
      operationId: getPost
      summary: Get post details
      description: Get detailed content for a single post by ID
      tags:
        - posts
      parameters:
        - name: postId
          in: path
          description: Post ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Post information returned successfully
        '404':
          description: Post not found

components:
  schemas:
    User:
      type: object
      description: User information
      properties:
        id:
          type: string
          description: User ID
        name:
          type: string
          description: User name
        email:
          type: string
          format: email
          description: User email
        createdAt:
          type: string
          format: date-time
          description: Created time
      required:
        - name
        - email

    Post:
      type: object
      description: Post information
      properties:
        id:
          type: string
          description: Post ID
        title:
          type: string
          description: Post title
        content:
          type: string
          description: Post content
        userId:
          type: string
          description: Author user ID
        createdAt:
          type: string
          format: date-time
          description: Created time
      required:
        - title
        - content
        - userId
